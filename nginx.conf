# Serves the built React app. Any path that is not a file falls back to index.html (client side routing).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }

  # Built files have a hash in their name, so they can be cached for a long time.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # index.html must never be cached, or a new release would not be picked up.
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
